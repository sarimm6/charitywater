<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>charity: water Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Drop the Water!</h1>
    <div class="instructions">Click and hold above the obstacles to release water into the jerrycan.</div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Water Collected: <span id="score">0</span> / 150</div>
            <button id="reset-btn" onclick="resetGame()">Reset</button>
        </div>
        
        <div id="win-screen">
            <h2>Thank You!</h2>
            <p>You successfully filled the charity: water jerrycan.</p>
            <button onclick="resetGame()">Play Again</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
